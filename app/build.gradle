plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("kotlin-kapt")
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace "com.techyourchance.dagger2course"
    compileSdk 35
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    packaging {
        resources {
            it.merges.add("META-INF/LICENSE.md")
            it.merges.add("META-INF/LICENSE-notice.md")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.8.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'org.junit.jupiter:junit-jupiter:5.11.3'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Dagger 2
    implementation "com.google.dagger:dagger:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"


    // JUnit 5 API and engine for unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'

    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3")

    // MockK for unit tests
    testImplementation("io.mockk:mockk:1.13.7")

    // MockK for Android instrumented tests
    androidTestImplementation("io.mockk:mockk-android:1.13.7")

    // Mockito for mocking
    testImplementation 'org.mockito:mockito-core:5.2.0'

    // Android-specific testing
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Test Runners
    testImplementation 'de.mannodermaus.junit5:android-test-core:1.3.0'
    androidTestImplementation 'de.mannodermaus.junit5:android-test-runner:1.3.0'
}