buildscript {
    ext {
        kotlin_version = '2.1.0'
        hilt_version = '2.55'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.1'
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version("$kotlin_version")
    id 'com.google.dagger.hilt.android' version "$hilt_version" apply false

}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

