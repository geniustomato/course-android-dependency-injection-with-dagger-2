buildscript {
    ext {
        kotlin_version = '1.8.20'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id("org.jetbrains.kotlin.jvm") version("2.1.0")
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

